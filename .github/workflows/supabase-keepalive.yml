name: Supabase Keep-Alive

# Free-tier Supabase projects pause after ~7 days of inactivity.
# This runs a tiny read-only query every 5 days to keep the project active.
on:
  schedule:
    - cron: '0 6 */5 * *'
  workflow_dispatch:

permissions:
  contents: write # needed only for the repo keep-alive commit below

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # GitHub disables scheduled workflows in public repos after 60 days without repo activity.
      # If the last commit is older than 45 days, add an empty commit to reset that timer.
      # (Pushes made with GITHUB_TOKEN do not trigger the Pages deploy workflow.)
      - name: Keep schedule alive (empty commit if repo is idle)
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          age_days=$(( (now - last) / 86400 ))
          echo "Last commit is $age_days day(s) old"
          if [ "$age_days" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep scheduled workflows active"
            git push
          fi

      - name: Ping Supabase (read-only query)
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          # Fails the job (-f) on any non-2xx so a paused/broken project shows up as a red run.
          # With RLS on, the anon role gets an empty [] back, which still counts as DB activity.
          curl -sS -f --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/rest/v1/wrapped_keys?select=user_id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
          echo
          echo "Supabase keep-alive OK"
